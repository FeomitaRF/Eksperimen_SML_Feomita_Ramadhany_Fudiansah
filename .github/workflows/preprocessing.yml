name: Run Data Preprocessing

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preprocessing script
        run: |
          python preprocessing/automate_Feomita_Ramadhany_Fudiansah.py             --input breast_cancer_raw/breast_cancer_raw.csv             --output preprocessing/breast_cancer_preprocessing

      - name: Upload preprocessed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: breast-cancer-preprocessed-dataset
          path: preprocessing/breast_cancer_preprocessing/breast_cancer_preprocessed.csv

      - name: Commit updated preprocessed dataset
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocessing/breast_cancer_preprocessing/breast_cancer_preprocessed.csv
          git diff --cached --quiet || git commit -m "Update preprocessed dataset"
          git push
